apiVersion: v1
kind: Pod
metadata: { name: multi-gpu, namespace: gpu-test }
spec:
  schedulerName: hami-scheduler
  restartPolicy: Never
  containers:
  - name: t
    image: docker.io/pytorch/pytorch:2.10.0-cuda13.0-cudnn9-runtime
    command: ["sh","-c","nvidia-smi -L; nvidia-smi topo -m; python /probe/gpuprobe.py"]
    env: [{ name: MODE, value: all }, { name: SECONDS_, value: "8" }]
    resources:
      limits: { nvidia.com/gpu: 4 }
    volumeMounts: [{ name: probe, mountPath: /probe }, { name: shm, mountPath: /dev/shm }]
  volumes:
  - { name: probe, configMap: { name: gpuprobe } }
  - { name: shm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
