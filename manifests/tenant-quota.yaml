# Host-side limits on what a tenant can consume.
#
# These live on the HOST namespace, not inside the vCluster, and that is the
# whole point: a tenant is an administrator of its own cluster and can delete
# any quota it can see. Only the host's copy binds it, and a tenant cannot
# reach the host API at all.
#
# Apply with the host kubeconfig, substituting the namespace:
#   sed 's/NAMESPACE/tenant-a/' tenant-quota.yaml | kubectl apply -f -
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: NAMESPACE
spec:
  hard:
    # GPU. Two independent axes, and a tenant is bound by whichever it hits
    # first -- both before nvproxy enforces the per-sandbox share.
    #
    # `nvidia.com/gpu` is a count of whole GPUs a pod may hold at once, summed
    # over the tenant's pods. HAMi advertises deviceSplitCount (10) units per
    # physical card so that ten pods can each hold one, but the number a pod
    # writes is a count of distinct devices: its scheduler refuses a node that
    # has fewer cards than the pod asked for. So this bounds how many GPUs the
    # tenant may occupy, and raising it is what lets a tenant hold a whole card
    # (`nvidia.com/gpu: 1`, no gpumem) or several (`nvidia.com/gpu: 2`).
    #
    # `nvidia.com/gpumem` is MiB, and is charged PER DEVICE: a pod asking for
    # 2 devices and 2000 MiB counts 2000 against this quota per device, and is
    # admitted 2000 on each. Leave headroom accordingly.
    #
    # Two ways a tenant gets more GPU memory than the gpumem line suggests,
    # which is why the gpu count is set as well and is the axis that actually
    # bounds a tenant:
    #
    #   - A pod that omits gpumem entirely is not charged against it at all,
    #     and runs at the node ceiling -- the whole of each device it holds.
    #   - ResourceQuota charges the gpumem request ONCE per pod, while HAMi
    #     admits it per device. A pod with gpu:2 and gpumem:2048 counts 2048
    #     here and is admitted 4096 MiB of real GPU memory. The quota
    #     undercounts a multi-GPU pod by its device count.
    #
    # Kubernetes has no capacity-aware quota that would fix this (and none for
    # DRA either); bounding the device count is the mechanism that exists.
    requests.nvidia.com/gpu: "4"
    requests.nvidia.com/gpumem: "4096"

    # CPU and memory. Note that quoting these obliges *every* pod in the
    # namespace to declare requests and limits, including the vCluster control
    # plane itself -- hence the LimitRange below, which supplies defaults for
    # anything that does not.
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 12Gi

    # A ceiling on object count, so that a tenant cannot exhaust the host API
    # server with pods that individually fit.
    pods: "30"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: NAMESPACE
spec:
  limits:
    - type: Container
      # Applied to containers that state no limit, which is what keeps the
      # quota above from rejecting them outright.
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
