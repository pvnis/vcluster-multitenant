flannel-backend: none
disable-network-policy: true
disable-kube-proxy: true
egress-selector-mode: cluster
# Both nodes address each other over Tailscale: sensai sits behind NAT on
# 192.168.0.0/24 and is unreachable from sens1 on 128.178.8.0/24, while
# Cilium's VXLAN tunnel needs the peer's node IP to be reachable in both
# directions. The old LAN address stays in tls-san so existing kubeconfigs
# and anything still dialing 192.168.0.198 keep working.
node-ip: 100.93.194.25
tls-san:
  - 100.93.194.25
  - 192.168.0.198
  - sensai
