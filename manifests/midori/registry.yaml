# In-cluster image registry, replacing the planned deployment0:5000 (which does
# not resolve from midori). Stateless: the blobs live in the project's RGW
# bucket at s3://midori/registry, so both replicas serve the same content and
# losing a node loses nothing.
#
# Nodes pull through 127.0.0.1:30500 (registries.yaml maps registry.midori to
# it), which Cilium's host-namespace socket LB serves on every node.
#
# registry:2.8.3, not 3.x: 3.x uses aws-sdk-go-v2, whose default request
# checksums older RGW releases reject. The RGW presents a KollaTestCA
# certificate that nothing trusts, hence skipverify.
#
# Needs the Secret, created out of band (never commit it):
#   kubectl -n registry create secret generic registry-s3 \
#     --from-literal=REGISTRY_STORAGE_S3_ACCESSKEY=... \
#     --from-literal=REGISTRY_STORAGE_S3_SECRETKEY=... \
#     --from-literal=REGISTRY_HTTP_SECRET=$(openssl rand -hex 32)
apiVersion: v1
kind: Namespace
metadata: { name: registry }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: registry, namespace: registry }
spec:
  replicas: 2
  selector: { matchLabels: { app: registry } }
  template:
    metadata: { labels: { app: registry } }
    spec:
      topologySpreadConstraints:
      - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: registry } } }
      containers:
      - name: registry
        image: registry:2.8.3
        ports: [{ containerPort: 5000 }]
        envFrom: [{ secretRef: { name: registry-s3 } }]
        env:
        - { name: REGISTRY_STORAGE, value: s3 }
        - { name: REGISTRY_STORAGE_S3_REGION, value: us-east-1 }
        - { name: REGISTRY_STORAGE_S3_REGIONENDPOINT, value: "https://openstack-lab.phoenix.tyo:6780" }
        - { name: REGISTRY_STORAGE_S3_BUCKET, value: midori }
        - { name: REGISTRY_STORAGE_S3_ROOTDIRECTORY, value: /registry }
        - { name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE, value: "true" }
        - { name: REGISTRY_STORAGE_S3_SKIPVERIFY, value: "true" }
        - { name: REGISTRY_STORAGE_REDIRECT_DISABLE, value: "true" }
        - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
        readinessProbe: { httpGet: { path: /v2/, port: 5000 } }
        resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: registry, namespace: registry }
spec:
  type: NodePort
  selector: { app: registry }
  ports: [{ port: 5000, targetPort: 5000, nodePort: 30500 }]
