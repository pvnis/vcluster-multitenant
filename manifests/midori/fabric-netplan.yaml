# Per-node netplan for the Hedgehog fabric vNIC (enp5s0), one trunk carrying the
# three Midori VPC VLANs. Install as a SEPARATE file so it never touches the
# existing ens3 config (netplan merges /etc/netplan/*.yaml):
#     sudo cp fabric-netplan.yaml /etc/netplan/60-fabric.yaml
#     sudo chmod 600 /etc/netplan/60-fabric.yaml
#     sudo netplan try         # safe: auto-reverts in 120s if you lose the box
#     sudo netplan apply
#
# DELIBERATELY: ens3 keeps the node's primary IP, default route and the Cilium
# dataplane. These subinterfaces get NO default route — only their on-link /24s
# plus the one storage route. So node-to-node, pod and egress stay on ens3.
#
# Per node, change ONLY the host octet (cp-0 = .7 here, as assigned). Apply the
# same file to cp-1/cp-2/eye-0, and to amd-0 and nv-0/nv-1 once their vNIC is
# attached / they rejoin.
#
# FILL ONLY <OCTET> — this node's host number, SAME on all three VLANs:
#   cp-0=100  cp-1=101  cp-2=102   eye-0=10   nv-0=110  nv-1=111   amd-0=120
#   NOTE: the fabric listed cp-0 as a BGP neighbor at 10.100.0.7; with this scheme
#   cp-0 is .100, so the fabric's neighbor entry must be updated to 10.100.0.100 or
#   the iBGP session won't establish.
# Avoid reserved addresses: .1 on midori-bgp (router0) and .2 on midori-storage
# (the storage gateway). Everything else is resolved: MTU 9000 (jumbo), and the
# Ceph network 10.33.0.0/24 (mons 10.33.0.61-63) reached via 10.100.2.2.
# The vNIC is a BlueField-2 VF; the interface may not be named enp5s0 on every box
# (confirm with `ip -br link`) — rename the keys below if it differs.
network:
  version: 2
  renderer: networkd
  ethernets:
    enp5s0:                       # trunk parent — no IP of its own
      dhcp4: no
      dhcp6: no
      accept-ra: no
      mtu: 9000
  vlans:
    enp5s0.106:                   # midori-bgp  (VLAN 106, 10.100.0.0/24) — BGP + external VIPs
      id: 106
      link: enp5s0
      mtu: 9000
      dhcp4: no
      addresses: [10.100.0.<OCTET>/24]
      # NO gateway/default route here. router0 learns our VIPs via BGP (Cilium
      # peers it over this subnet); return traffic is routed by router0.
    enp5s0.107:                   # midori-internal (VLAN 107, 10.100.1.0/24) — idle for now
      id: 107
      link: enp5s0
      mtu: 9000
      dhcp4: no
      addresses: [10.100.1.<OCTET>/24]
      # Reserved: node/pod east-west stays on ens3 ("ens3 for now"). Brought up
      # and addressed so the path is ready, but nothing routes over it yet.
    enp5s0.108:                   # midori-storage (VLAN 108, 10.100.2.0/24) — CephFS
      id: 108
      link: enp5s0
      mtu: 9000
      dhcp4: no
      addresses: [10.100.2.<OCTET>/24]     # no DHCP here; .2 is the storage gateway
      routes:
        - to: 10.33.0.0/24                 # Ceph/storage network (mons 10.33.0.61-63)
          via: 10.100.2.2                  # midori-stor inter-VPC gw (peered with storage)
      # This is the ONLY route out .108 (not a default route). Ceph accepts TCP
      # 3300/6789/6800-7568 from this range; ping/SSH are blocked, so test with TCP.
