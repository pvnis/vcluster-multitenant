# agent-sandbox v1.0.6 in a midori tenant: a warm pool of Python sandboxes an
# agent drives through sandboxd. Applied with the TENANT's kubeconfig, after
# the release itself:
#
#   kubectl apply --server-side -f \
#     https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v1.0.6/sandbox-with-extensions.yaml
#   kubectl apply -f sandbox.yaml
#
# Isolation comes from the platform, not from the sandbox: every tenant pod is
# a gVisor sandbox (the quota webhook sets the runtime class), inside the
# tenant's Cilium floor. On top of that, the managed NetworkPolicy below admits
# only the agent, on sandboxd's two ports, and lets sandboxes reach nothing at
# all -- the code they run is the least trusted thing in the tenant.
#
# That NetworkPolicy only holds because the pods carry
# midori.phoenix/network=sandbox: policies only ever add allows, and the
# platform's own per-tenant policies allow every pod in the tenant intra-tenant
# traffic, DNS and (per tenant) the internet and model providers. The label
# takes the pod out of those, so its own NetworkPolicy is all it gets.
#
# sandboxd has no release on registry.k8s.io yet; this is the staging build of
# the v1.0.6 tag (pinned, not latest-main).
apiVersion: v1
kind: Namespace
metadata: { name: agents }
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata: { name: python, namespace: agents }
spec:
  service: true
  networkPolicyManagement: Managed
  networkPolicy:
    ingress:
    - from:
      - podSelector: { matchLabels: { app: agent } }
      ports: [{ port: 8080, protocol: TCP }, { port: 9090, protocol: TCP }]
    egress: []
  podTemplate:
    metadata:
      # Opts the pods out of the platform's per-tenant grants (intra-tenant
      # traffic, DNS, internet, model providers, S3): with it, the
      # NetworkPolicy above is all they get, plus kubelet probes.
      labels: { midori.phoenix/network: sandbox }
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      initContainers:
      - name: install-sandboxd
        image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandboxd:v20261008-v1.0.6
        command: ["/bin/sh", "-c", "cp /usr/local/bin/sandboxd /sandboxd-bin/sandboxd"]
        securityContext: &unprivileged
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        resources: &small
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: "1", memory: 512Mi }
        volumeMounts: [{ name: sandboxd-bin, mountPath: /sandboxd-bin }]
      containers:
      - name: python
        image: python:3.12-slim
        command: [/sandboxd-bin/sandboxd, --root-dir=/workspace, --rest-port=8080, --grpc-port=9090]
        securityContext: *unprivileged
        resources: *small
        ports: [{ containerPort: 8080 }, { containerPort: 9090 }]
        readinessProbe: { httpGet: { path: /v1/health, port: 8080 } }
        volumeMounts:
        - { name: sandboxd-bin, mountPath: /sandboxd-bin, readOnly: true }
        - { name: workspace, mountPath: /workspace }
      volumes:
      - { name: sandboxd-bin, emptyDir: {} }
      - { name: workspace, emptyDir: {} }
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata: { name: python, namespace: agents }
spec:
  replicas: 2
  sandboxTemplateRef: { name: python }
