# Phase 1: the Teleport control plane (Auth + Proxy), standalone, Community/OSS.
#
#   helm repo add teleport https://charts.releases.teleport.dev
#   helm install teleport teleport/teleport-cluster --version <match> -n teleport --create-namespace -f teleport-cluster-values.yaml
#
# The Proxy is the ONLY public ingress; Auth is private. Agents dial OUTBOUND to
# the Proxy (reverse tunnel), so tenant APIs need no inbound exposure.

# The Teleport cluster name == the Proxy's public address (cert CN/SAN, every
# agent/client config). CHOSEN: option B -- self-signed CA, no DNS. Clients reach
# the Proxy at this name resolved to the /26 VIP (an /etc/hosts entry or internal
# DNS) and trust the self-signed CA (`tbot`/`tsh` are given it). Kept as a hostname
# (not the raw IP) so switching to option A later is just: point real DNS at the
# VIP + set acme.enabled: true -- no name change, no agent reconfig.
# TODO(A): once a public DNS record for this name -> 119.15.113.134 exists, enable
#          acme below for a real Let's Encrypt cert and drop the self-signed CA.
clusterName: "teleport.midori.phoenix.tyo"

# Standalone: one Auth + one Proxy, local backend on a PVC. (HA = Postgres/etcd +
# >=2 replicas, later.)
chartMode: standalone
# Community/OSS edition (default). Enterprise only for human SSO / Access Requests.
enterprise: false

proxyListenerMode: multiplex   # one TLS port for web, kube, ssh, tunnel

# Expose the Proxy on a public /26 VIP via Cilium LB-IPAM + BGP (the mechanism we
# built). ZTNA is identity-gated, so no source-IP allowlist is required -- add one
# only as defence-in-depth.
proxy:
  highAvailability:
    replicaCount: 1
  service:
    type: LoadBalancer
    # DECISION ★: a free address in 119.15.113.128/26 (e.g. .134). The lb-pool
    # label (for LB-IPAM) is added to the Service after install -- the `teleport`
    # namespace is not a tenant namespace, so the controller/guard don't touch it.
    spec:
      loadBalancerIP: "119.15.113.134"

# TLS: option B (self-signed). Teleport self-signs for clusterName on first start;
# agents trust its CA (exported with `tctl auth export`). Switch to A (ACME) later
# by setting `acme: true` + `acmeEmail`.
acme: false

# Local backend persistence (standalone = SQLite). MUST be node-local disk, not a
# networked FS -- SQLite over CephFS/NFS risks lock corruption. local-path pins the
# single standalone pod to its node; HA (Postgres) removes this later.
persistence:
  enabled: true
  storageClassName: "local-path"
  size: "5Gi"

# Audit log: stays in the local backend for standalone; ship to Loki/S3 later.

# The teleport-operator reconciles Teleport resources (roles, provision tokens,
# bots) declared as Kubernetes CRs into Auth — so the midori controller manages
# each tenant's Teleport role + join token declaratively (spec.access.teleport),
# with no tctl. Enabling it adds the operator Deployment + the resources CRDs and
# bootstraps an `operator` role/token into the Auth config (a one-time Auth pod
# restart; the Proxy and existing agent tunnels are untouched).
#   helm upgrade teleport teleport/teleport-cluster --version 18.11.12 -n teleport \
#     -f teleport-cluster-values.yaml
operator:
  enabled: true
