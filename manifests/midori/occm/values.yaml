# openstack-cloud-controller-manager (chart 2.36.5, v1.36.0) on midori, Service
# controller only:
#
#   kubectl -n kube-system create secret generic cloud-config --from-file=cloud.conf   # never commit
#   helm upgrade --install occm cpo/openstack-cloud-controller-manager --version 2.36.5 \
#     -n kube-system -f values.yaml
#
# Only `service`: the nodes were not started with --cloud-provider=external and
# have no providerID, and cloud-node-lifecycle deletes Node objects it cannot
# match to an instance. route is for clusters using OpenStack routing, not
# Cilium.
#
# cloud.conf (README.md) makes load balancers internal by default
# (internal-lb); what tenants may ask for is load-balancer-guard.yaml.
enabledControllers: [service]
cluster:
  name: midori          # load balancers are named kube_service_midori_<namespace>_<name>
secret:
  enabled: true
  create: false
  name: cloud-config
# The chart's defaults mount flexvolume and /etc/kubernetes/pki host paths,
# which the service controller does not use.
extraVolumes: []
extraVolumeMounts: []
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
# k3s labels its servers node-role.kubernetes.io/control-plane=true, not "".
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
# k3s's embedded cloud controller already listens on 127.0.0.1:10258, and these
# pods use the host network.
controllerExtraArgs: |-
  - --secure-port=10268
