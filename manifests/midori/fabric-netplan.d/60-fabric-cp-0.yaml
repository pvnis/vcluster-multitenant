# cp-0 — fabric vNIC: enp5s0, host octet .100 (same on all three VLANs).
# Install as /etc/netplan/60-fabric.yaml (separate file; leaves ens3 untouched).
# If 'enp5s0' is wrong, check 'ip -br link' and fix the four refs below.
network:
  version: 2
  renderer: networkd
  ethernets:
    enp5s0: { dhcp4: no, dhcp6: no, accept-ra: no, mtu: 9000 }   # trunk parent, no IP
  vlans:
    enp5s0.106: { id: 106, link: enp5s0, mtu: 9000, dhcp4: no, addresses: [10.100.0.100/24] }   # midori-bgp (BGP+VIPs)
    enp5s0.107: { id: 107, link: enp5s0, mtu: 9000, dhcp4: no, addresses: [10.100.1.100/24] }   # midori-internal (idle)
    enp5s0.108:                                                                                     # midori-storage → CephFS
      id: 108
      link: enp5s0
      mtu: 9000
      dhcp4: no
      addresses: [10.100.2.100/24]           # no DHCP; .2 is the storage gateway
      routes:
        - { to: 10.33.0.0/24, via: 10.100.2.2 }  # Ceph net (mons .61-.63); only route out .108
