# /etc/rancher/k3s/registries.yaml on all five nodes.
#
# The plan pointed this at the tyo site registry, deployment0:5000, but that
# name does not resolve from midori. As built, the registry is in-cluster
# (registry.yaml here), stores its blobs in s3://midori/registry on RGW, and
# is reached on every node through NodePort 30500 on loopback. Images are
# referenced as registry.midori/<name>:<tag>; containerd rewrites that to the
# loopback endpoint. Push from a node with: crane push --insecure ... 127.0.0.1:30500/<name>:<tag>
#
# The single-node `docker save` + `k3s ctr images import` workflow does not
# scale past one GPU node, and `docker save` silently emits blob-less stubs
# when docker uses the containerd image store -- push to the registry instead.
#
# Bootstrap caveat: the registry's own image comes from Docker Hub, so it can
# never be served from here.
mirrors:
  "registry.midori":
    endpoint:
      - "http://127.0.0.1:30500"
