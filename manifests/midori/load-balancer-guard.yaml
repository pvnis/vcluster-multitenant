# Gate the public fabric VIP a tenant may draw.
#
#   kubectl apply -f load-balancer-guard.yaml
#
# A Service labelled midori.phoenix/lb-pool=public draws a VIP from the public
# /26 LB-IPAM pool (cilium-bgp.yaml) and Cilium advertises it over BGP. The
# vCluster syncer passes tenant-set labels through to the host, so this host-side
# check is what stops a tenant self-granting one: the label is denied unless the
# namespace is midori.phoenix/load-balancers=public (set by the controller from
# the Tenant's loadBalancers.public). The controller stamps the label only for
# granted tenants (controller/src/components/loadbalancers.ts); this policy is
# the independent gate.
#
# History: this replaced a per-tenant OpenStack floating-IP gate. OpenStack
# Octavia and the cloud-controller (occm) were retired 2026-11-19 -- tenant VIPs
# now come from the Cilium LB-IPAM pool, not amphora load balancers.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: tenant-load-balancers }
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions: [{ key: tenant, operator: Exists }]
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [services]
  variables:
  - name: lbMode
    expression: >-
      has(namespaceObject.metadata.labels) && 'midori.phoenix/load-balancers' in namespaceObject.metadata.labels
        ? namespaceObject.metadata.labels['midori.phoenix/load-balancers'] : 'none'
  validations:
  - expression: >-
      !(has(object.metadata.labels) && 'midori.phoenix/lb-pool' in object.metadata.labels
        && object.metadata.labels['midori.phoenix/lb-pool'] == 'public')
      || variables.lbMode == 'public'
    message: "This tenant may not draw a public fabric VIP: the label midori.phoenix/lb-pool=public requires Tenant spec.loadBalancers.public."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: tenant-load-balancers }
spec:
  policyName: tenant-load-balancers
  validationActions: [Deny]
