# Helm overrides for AMD's device-metrics-exporter on midori-amd-0, to get
# physical AMD GPU metrics (VRAM used, gfx activity, power, temp) that the
# NVIDIA DCGM panels can't show. The chart isn't published to a Helm repo, so
# install from the cloned source (see this directory's notes / the commands
# below).
#
# It is a HOST monitoring DaemonSet (privileged, mounts /dev and /sys, reads
# amd-smi) — same trust level as node-exporter/dcgm-exporter. It runs under the
# node's default runtime (runc), NOT gVisor: it needs real GPU access, and the
# chart sets no runtimeClassName. Only on the AMD node (nodeSelector).
#
# Images must be in registry.midori first (the node pulls through the mirror).
# NOTE: the chart's default image.tag is v1.5.4 but docker.io only publishes up
# to v1.5.3, so pin v1.5.3 here (below).
#   crane copy docker.io/rocm/device-metrics-exporter:v1.5.3 127.0.0.1:30500/rocm/device-metrics-exporter:v1.5.3
#   crane copy docker.io/library/busybox:1.36                127.0.0.1:30500/library/busybox:1.36
#
# Install (from a checkout of github.com/ROCm/device-metrics-exporter):
#   helm install amd-metrics-exporter ./helm-charts \
#     -n gpu-metrics --create-namespace -f metrics-exporter-values.yaml
#
# The ServiceMonitor it creates is auto-scraped: midori's Prometheus has an
# empty serviceMonitorSelector (selects all). Metrics land at :5000/metrics
# with labels gpu_id and hostname. Then the admin dashboard's build.py gets
# "AMD VRAM used" / "AMD GPU utilisation" panels (GPU_USED_VRAM, GPU_GFX_ACTIVITY).
nodeSelector:
  gpu.vendor: amd
image:
  repository: registry.midori/rocm/device-metrics-exporter
  tag: v1.5.3
  pullPolicy: IfNotPresent
  initContainerImage: registry.midori/library/busybox:1.36
serviceMonitor:
  enabled: true
