# The AMD device plugin, on every node labelled gpu.vendor=amd (midori-amd-0).
# Advertises VRAM to the kubelet as amd.com/gpu-vram-mib (512-MiB units), hands
# each allocated container /dev/kfd and the GPU's render node (from the KFD
# topology, renderD129 on midori-amd-0) with HSA_USERPTR_FOR_PAGED_MEM=0, and
# publishes the node's hardware as hami.io/node-amd-register (its only API use).
#
# Not enforcement: gVisor's Sentry enforces the per-pod limit from the
# dev.gvisor.flag.amdproxy-* annotations the quota webhook injects in tenant
# namespaces. The tenant-level cap is quota.amdGpuVramMiB in the Tenant spec
# (controller renders requests.amd.com/gpu-vram-mib).
#
# pvnis/amd-gpu-device-plugin @ 7bb3292; image digest
# sha256:44be28f6d046d943085d6f2dcce97813a8802bdaed549bc0f9757b1d6cd2368e.
#
# Runs PRIVILEGED as deployed by the operator: KFD hides a GPU's topology from
# containers whose device cgroup excludes its render node, so the unprivileged
# securityContext (drop ALL, no-privilege-escalation) found no GPU. The
# securityContext below is the privileged form actually running; tighten it
# only after confirming the plugin still enumerates the GPU.
#
# After a kubelet/k3s restart the plugin does not re-register (node shows
# amd.com/gpu-vram-mib: 0); delete the pod to re-register.
#
# Applied by the operator (midori-amd-0 has no cluster API access); kept here as
# the record. The node also keeps gpu.vendor=amd:NoSchedule until AMD tenancy is
# opened; the plugin tolerates it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amd-gpu-device-plugin
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amd-gpu-device-plugin
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amd-gpu-device-plugin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: amd-gpu-device-plugin
subjects:
  - kind: ServiceAccount
    name: amd-gpu-device-plugin
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amd-gpu-device-plugin
  namespace: kube-system
  labels:
    app: amd-gpu-device-plugin
spec:
  selector:
    matchLabels:
      app: amd-gpu-device-plugin
  template:
    metadata:
      labels:
        app: amd-gpu-device-plugin
    spec:
      serviceAccountName: amd-gpu-device-plugin
      priorityClassName: system-node-critical
      nodeSelector:
        gpu.vendor: amd
      tolerations:
        - key: gpu.vendor
          operator: Equal
          value: amd
          effect: NoSchedule
      containers:
        - name: plugin
          image: registry.midori/amd-gpu-device-plugin:7bb3292
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
              readOnly: true
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: sys
          hostPath:
            path: /sys
