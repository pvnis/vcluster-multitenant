# Temporary test tenant for INFER-118 (tenant cache isolation). Delete after the test.
apiVersion: midori.phoenix/v1alpha1
kind: Tenant
metadata: { name: tenant-infer118 }
spec:
  management: Manage
  quota:
    gpus: 2
    gpuMemoryMiB: 13000
    cpu: { requests: "8", limits: "16" }
    memory: { requests: 32Gi, limits: 48Gi }
  network: { internet: true }
  controlPlane: { size: large }
  gateway: { expose: true }
  observability: { dashboards: [overview] }
