\* The fixed broker: the slot is freed on teardown (FreeOnDestroy=TRUE), and the
\* table is sized for the peak number of concurrent sandboxes (MaxSlots = |Sandboxes|).
\* Fail-open admission is left on (FailClosed=FALSE) to show it is HARMLESS once
\* slots are freed and the table is sized correctly.
\* Expect TLC: all invariants hold and Drains holds (no violations).
SPECIFICATION Spec

CONSTANTS
    Sandboxes = {s1, s2, s3}
    MaxSlots = 3
    FreeOnDestroy = TRUE
    FailClosed = FALSE

INVARIANT TypeOK
INVARIANT SlotsBounded
INVARIANT NoSlotLeak
INVARIANT EnforcementActive

PROPERTY Drains
