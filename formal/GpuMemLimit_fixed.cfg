\* The fix: --nvproxy-gpu-memory-limit-per-device (PerDevice=TRUE). Each device is
\* capped at GpuMem; unattributable VRAM must fit on every device the pod uses.
\* Card = 2*GpuMem sizes g0 for both p1 and p2. Expect TLC: all invariants hold.
\*
\* To see that per-device enforcement still needs correct card sizing, set
\* Card = 3 (< 2*GpuMem): NoOversubscription then FAILS even with PerDevice=TRUE
\* -- enforcement caps each pod, but the card was under-provisioned for the placement.
SPECIFICATION Spec

CONSTANTS
    GpuMem = 2
    Card = 4
    PerDevice = TRUE

INVARIANT TypeOK
INVARIANT PerDeviceLimitHeld
INVARIANT NoOversubscription
