\* The pre-fix webhook: one TOTAL limit (gpumem x #GPUs) across the pod's devices,
\* with no per-device cap (PerDevice=FALSE). Expect TLC to VIOLATE both
\* PerDeviceLimitHeld and NoOversubscription: p1 stacks its whole 2*GpuMem total
\* onto g0, past its share and the card, into p2's VRAM.
SPECIFICATION Spec

CONSTANTS
    GpuMem = 2
    Card = 4
    PerDevice = FALSE

INVARIANT TypeOK
INVARIANT PerDeviceLimitHeld
INVARIANT NoOversubscription
