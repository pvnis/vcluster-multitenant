\* The historical broker: slots are never freed on teardown (FreeOnDestroy=FALSE)
\* and a full table admits new groups unenforced (FailClosed=FALSE).
\* Expect TLC to VIOLATE NoSlotLeak and EnforcementActive and report Drains fails:
\* the leak fills the table, then a new group runs with weights silently ignored.
SPECIFICATION Spec

CONSTANTS
    Sandboxes = {s1, s2, s3}
    MaxSlots = 3
    FreeOnDestroy = FALSE
    FailClosed = FALSE

INVARIANT TypeOK
INVARIANT SlotsBounded
INVARIANT NoSlotLeak
INVARIANT EnforcementActive

PROPERTY Drains
