# Overlay for tenants that schedule AMD GPU workloads onto a gpu.vendor=amd
# node (midori-amd-0). The mirror of nv-tenant.yaml, one node label different.
#
# The midori tenant controller does NOT merge this file: it sets the same node
# sync from the Tenant's spec.gpuVendor (templates.ts vclusterValues), so a
# tenant created with gpuVendor: amd gets exactly this. The file is kept for
# the vcluster-CLI path and as the documented reasoning.
#
# Why real node sync: tenant.yaml's default fakes nodes, which carry neither a
# real gpu.vendor label nor a real amd.com/gpu-vram-mib allocatable, so a GPU
# pod's own scheduler (inside the vCluster) can never place it and the syncer
# never gets a pod to create on the host. Syncing the real node fixes both.
#
# The selector keeps exposure to exactly the AMD node(s): the tenant learns
# their name, labels and current allocatable, and nothing about other nodes or
# other tenants.
#
#   vcluster create tenant-amd-a -n tenant-amd-a \
#     --values tenant.yaml --values amd-tenant.yaml --values tenant-amd-a.yaml
#
# Cross-node Cilium note (TWO-VENDOR-CLUSTER.md): on midori a tenant control
# plane may land on any node, so admin kubectl traffic to it can cross the
# overlay and arrive as the reserved identity remote-node, which no ipBlock
# rule matches. tenant-cnp-amd.yaml's fromEntities: [remote-node] rule handles
# that; apply it when the control plane is not co-located with the client.
sync:
  fromHost:
    nodes:
      enabled: true
      selector:
        labels:
          gpu.vendor: amd
